<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />

    <!-- Dark unless the visitor chose light, applied before first paint so it never flashes.
         src/lib/theme.ts takes over once React loads. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved !== 'light'
          document.documentElement.classList.toggle('dark', dark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0f0f0f' : '#f8f7f4')
        } catch (e) {}
      })()
    </script>

    <title>Henry Hsu</title>
    <meta
      name="description"
      content="Henry Hsu builds GenAI systems and the infrastructure behind them. Former Google SWE intern and MaiAgent GenAI team lead, now completing an M.C.S. at Rice University."
    />
    <link rel="canonical" href="https://www.yarikama.com/" />

    <!-- Link previews (LinkedIn, Slack, X, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Henry Hsu" />
    <meta property="og:url" content="https://www.yarikama.com/" />
    <meta property="og:title" content="Henry Hsu | Software Engineer, GenAI & Infrastructure" />
    <meta
      property="og:description"
      content="Building GenAI systems and the infrastructure behind them. Former Google SWE intern, MaiAgent GenAI team lead, Rice M.C.S."
    />
    <meta property="og:image" content="https://www.yarikama.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Henry Hsu, Software Engineer across GenAI and infrastructure" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Cormorant Garamond (humanist), Inter (body), Overpass Mono (technical), Noto Serif TC (Chinese) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&family=Overpass+Mono:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
